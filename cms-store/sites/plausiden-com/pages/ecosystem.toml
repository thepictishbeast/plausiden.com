[sections.blocks.fields]
heading = "Flagship projects."
lede = "Each is independently auditable and built on the same substrates — typed contracts, adversarial validation, accessibility and dual themes by default."
card_titles = ["ThunderCrab", "Forge + Loom", "Mailroom", "SacredVote", "Privacy Suite", "Local-first AI"]
card_bodies = [
  "A Rust-native, sovereignty-first email client — Android-first with desktop and CLI. IMAP push, Markdown-native mail, RFC-correct threading, consent-only read receipts, and post-quantum hybrid TLS already shipping.",
  "The website substrate: typed content in, accessible CSP-strict dual-theme sites out. Every production PlausiDen site is derived from it rather than hand-coded.",
  "Mail-server configuration as a typed substrate: Rust sources emit validated Sieve and mailbox layouts, with spam-training watchers and a rehearsed-restore audit harness.",
  "Verifiable, privacy-preserving civic voting research: post-quantum ballots, WebAuthn, zkTLS, and a post-quantum Belenios line of work.",
  "Plausible deniability as engineering: a deniable filesystem (hidden volumes, ML-KEM, Shamir), plus fragmenting, distribution, cleanup, and monitoring layers — possession proves nothing.",
  "CPU-viable, federated-by-design neurosymbolic AI. Deterministic systems first; learned components as auditable, fail-closed augmentation — no cloud dependency.",
]

