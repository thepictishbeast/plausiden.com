[[sections.blocks]]
kind = "heading_body"

[sections.blocks.fields]
heading = "Track record."
body = """
A business mail platform in production since May 2026 with fully green authentication DNS and automated restore drills. Production websites served from owned infrastructure. Nine tagged ThunderCrab releases with tag-to-APK release automation. Over 1,200 tests green across the website substrate, including a pixel-level site-reproduction harness. A session classifier deployed at zero false positives and zero false negatives across 1,182 real transcripts. Tens of terabytes of encrypted ZFS under snapshot discipline backing all of it.
"""

