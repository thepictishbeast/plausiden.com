[sections.blocks.fields]
headline = "Sovereign software, end to end."
lede = "PlausiDen designs, builds, and operates its own stack — mail, web, identity, AI, storage — and holds every decision to six axes at once: fast, reliable, recoverable, secure, anonymous, private. Most engineering picks two or three and trades the rest away. Refusing that trade is the founding constraint of everything here."

[[sections]]
theme = "muted"
anchor = "services"

[[sections.blocks]]
kind = "heading_body"

[sections.blocks.fields]
heading = "Services operating today."
body = """
These are not roadmap items; they run in production on PlausiDen-operated infrastructure.

Hosted email — full-stack mail with 100%-green authentication DNS (SPF, DKIM, DMARC, MTA-STS, TLS-RPT, DNSSEC, CAA), archival capture, snapshot backups with rehearsed restores, server-side sorting, and a self-audit harness that runs on every configuration change.

Web hosting — Rust-served sites behind strict security headers and modern TLS, with an onion-service presence.

Sovereign Workspace — a self-hosted, zero-trust collaboration stack: Matrix chat and calls, Nextcloud files, single sign-on, ERP, CRM, and remote management. FOSS end to end, on owned hardware.
"""

