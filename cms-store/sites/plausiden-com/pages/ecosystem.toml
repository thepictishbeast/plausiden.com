[[sections.blocks]]
kind = "heading_body"

[sections.blocks.fields]
heading = "The honest banner."
body = """
Most public PlausiDen repositories open with a deliberate warning: DO NOT USE — UNVERIFIED. Code is published for transparency and third-party audit from day one, while the Adversarial Validation Protocol withholds the fit-for-use claim until verification passes are actually earned. We would rather show unfinished work honestly than finished-looking work falsely.
"""

